<script>
// T-009B/C — dashboard client. Pure render functions return HTML strings; values are
// escaped and shown exactly as provided by the read layer. No inference or calculation.

const DASHBOARD_ENTRIES = ['DUMP', 'DECIDE', 'DESIGN'];
const ASC_FRONT_DOOR_URL = 'https://dzuddiyn.github.io/AISYNC/asc/';
const NOT_PROVIDED = 'Not provided';
const PROJECT_VIEWS = ['WORKSPACE', 'REVIEW', 'HISTORY'];
const CURRENT_TASK_STATUSES = ['CURRENT', 'ACTIVE', 'IN PROGRESS', 'OPEN'];
const READY_LOCK_STATUSES = ['READY TO LOCK', 'PROPOSED FOR PROCEED'];
const DELIVERED_STAGES = ['DELIVERED', 'DELIVERED !!', 'COMPLETE', 'COMPLETED'];
let dashboardState = { entry: 'DUMP', list: null, projectResult: null, ciResult: null, projectView: 'WORKSPACE' };

function escapeHtml(value) {
  return String(value === undefined || value === null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function textOrNotProvided(value) {
  const text = value === undefined || value === null ? '' : String(value);
  return text.trim() === ''
    ? '<span class="not-provided">' + NOT_PROVIDED + '</span>'
    : escapeHtml(text);
}

function renderProgress(progress) {
  if (progress && progress.state === 'PROVIDED' && typeof progress.value === 'number') {
    return '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' +
      escapeHtml(progress.value) + '"><span style="width:' + escapeHtml(progress.value) + '%"></span></div>' +
      '<div class="muted">' + escapeHtml(progress.raw) + '</div>';
  }
  if (progress && progress.state === 'UNREADABLE') {
    return '<span class="not-provided">Progress value not displayable: ' + escapeHtml(progress.raw) + '</span>';
  }
  return '<span class="not-provided">Progress: ' + NOT_PROVIDED + '</span>';
}

function renderIndexMeta(meta) {
  if (!meta) return '';
  return '<div class="muted">Index source: ' + textOrNotProvided(meta.source_artifact) +
    ' · commit ' + textOrNotProvided(meta.source_commit) +
    ' · updated_at ' + textOrNotProvided(meta.updated_at) +
    ' · freshness ' + escapeHtml(meta.freshness || 'UNVERIFIED') + '</div>';
}

function renderZassCiStatus(project, ciResult) {
  const repository = project && typeof project.github_repo === 'string' ? project.github_repo : '';
  const commitSha = project && project.index_metadata &&
    typeof project.index_metadata.source_commit === 'string'
    ? project.index_metadata.source_commit
    : '';
  const identity = '<div class="muted">Repository: ' + textOrNotProvided(repository) +
    ' · commit ' + textOrNotProvided(commitSha) + '</div>';

  if (!repository || !commitSha) {
    return '<div class="card ci-status"><strong>Commit-linked ZASS CI</strong>' + identity +
      '<p class="not-provided">CI lookup not available because repository or commit metadata is missing.</p></div>';
  }

  if (!ciResult) {
    return '<div class="card ci-status"><strong>Commit-linked ZASS CI</strong>' + identity +
      '<p class="muted">Loading factual GitHub CI status…</p></div>';
  }

  const status = ciResult.status || 'READ_ERROR';
  let detail = '<div>Status: <strong>' + escapeHtml(status) + '</strong></div>' +
    '<div>Workflow / job: ' + textOrNotProvided(ciResult.workflow_name) +
    ' / ' + textOrNotProvided(ciResult.job_name) + '</div>' +
    '<div>Conclusion: ' + textOrNotProvided(ciResult.conclusion) + '</div>' +
    '<div>Run ID: ' + textOrNotProvided(ciResult.run_id) + '</div>' +
    '<div>Fetched at: ' + textOrNotProvided(ciResult.fetched_at) + '</div>';

  if (typeof ciResult.run_url === 'string' && /^https:\/\/\S+$/.test(ciResult.run_url)) {
    detail += '<div><a href="' + escapeHtml(ciResult.run_url) +
      '" target="_blank" rel="noopener">Open GitHub Actions run</a></div>';
  }

  if (status === 'NOT_FOUND') {
    detail += '<p class="muted">No matching ZASS CI result was found for this exact commit. This is not a PASS result.</p>';
  } else if (status === 'READ_ERROR') {
    const error = ciResult.error || {};
    detail += '<p class="error">CI read error' +
      (error.code ? ' (' + escapeHtml(error.code) + ')' : '') +
      (error.message ? ' — ' + escapeHtml(error.message) : '') + '</p>';
  }

  return '<div class="card ci-status"><strong>Commit-linked ZASS CI</strong>' + identity + detail + '</div>';
}

function renderError(result) {
  const error = (result && result.error) || { code: 'UNKNOWN', message: 'No result returned.' };
  let detail = '';
  if (result && result.tab) detail += ' Tab: ' + escapeHtml(result.tab) + '.';
  if (result && result.missing && result.missing.length) detail += ' Missing: ' + escapeHtml(result.missing.join(', ')) + '.';
  if (result && result.duplicate && result.duplicate.length) detail += ' Duplicate: ' + escapeHtml(result.duplicate.join(', ')) + '.';
  return '<p class="error">FAILED (' + escapeHtml(error.code) + ') — ' + escapeHtml(error.message) + detail + '</p>';
}

function renderEntryTabs(active) {
  return '<div class="tabs" role="tablist">' + DASHBOARD_ENTRIES.map(function (entry) {
    return '<button type="button" data-entry="' + entry + '" aria-pressed="' + (entry === active) + '">' + entry + '</button>';
  }).join('') + '</div>';
}

function renderProjectItem(project) {
  return '<button type="button" class="project" data-project-id="' + escapeHtml(project.project_id) + '">' +
    '<strong>' + textOrNotProvided(project.project_name) + '</strong>' +
    renderProgress(project.progress) +
    '<div>Latest update: ' + textOrNotProvided(project.latest_update) + '</div>' +
    renderIndexMeta(project.index_metadata) +
    '</button>';
}

function renderRouteIntro(active) {
  if (active !== 'DUMP') return '';
  return '<section class="card route-intro">' +
    '<strong>DUMP → ZASSPILL</strong>' +
    '<p class="muted">Start with natural conversation. ASC routes the handoff; ZASSPILL owns the method semantics.</p>' +
    '<p><a href="' + ASC_FRONT_DOOR_URL + '" target="_blank" rel="noopener">Open ASC Front Door</a></p>' +
    '</section>';
}

function renderProjectList(result, entry) {
  if (!result || result.ok !== true) return renderError(result);
  const active = DASHBOARD_ENTRIES.indexOf(entry) >= 0 ? entry : 'DUMP';
  const projects = (result.groups && result.groups[active]) || [];
  let html = renderEntryTabs(active) + renderRouteIntro(active);
  html += projects.length
    ? projects.map(renderProjectItem).join('')
    : '<p class="muted">No ' + active + ' projects in ASC DB.</p>';
  const unrecognized = result.unrecognized_ui_entry || [];
  if (unrecognized.length) {
    html += '<p class="muted">' + unrecognized.length + ' project row(s) have a ui_entry other than DUMP/DECIDE/DESIGN and are not grouped.</p>';
  }
  return html;
}

function renderCell(column, row) {
  const value = row[column];
  if (column === 'canonical_url' && typeof value === 'string' && /^https:\/\/\S+$/.test(value)) {
    return '<a href="' + escapeHtml(value) + '" target="_blank" rel="noopener">' + escapeHtml(value) + '</a>';
  }
  if (column === 'receipt_json' || column === 'lineage_json') {
    return value ? '<details><summary>show</summary><pre>' + escapeHtml(value) + '</pre></details>' : '';
  }
  return escapeHtml(value);
}

function renderTable(columns, rows, emptyText) {
  if (!Array.isArray(rows) || rows.length === 0) {
    return '<p class="muted">' + escapeHtml(emptyText) + '</p>';
  }
  return '<div class="table-wrap"><table><thead><tr>' +
    columns.map(function (c) { return '<th>' + escapeHtml(c) + '</th>'; }).join('') +
    '</tr></thead><tbody>' +
    rows.map(function (row) {
      return '<tr>' + columns.map(function (c) { return '<td>' + renderCell(c, row) + '</td>'; }).join('') + '</tr>';
    }).join('') +
    '</tbody></table></div>';
}

const ACTION_PLAN_COLUMNS = ['ap_id', 'status', 'action', 'dependencies', 'pass_condition', 'source_lineage', 'source_commit', 'updated_at'];
const ZASS_COLUMNS = ['record_type', 'record_id', 'status', 'summary', 'lineage_json', 'source_artifact', 'source_commit', 'canonical_url', 'updated_at'];
const HISTORY_COLUMNS = ['timestamp', 'request_id', 'operation', 'destination', 'status', 'affected_resource', 'commit_or_record_id', 'failure_reason', 'receipt_json'];

function renderSection(title, body) {
  return '<section class="card"><h2>' + escapeHtml(title) + '</h2>' + body + '</section>';
}

function normalizeStateToken(value) {
  return String(value === undefined || value === null ? '' : value)
    .trim()
    .replace(/_/g, ' ')
    .replace(/\s+/g, ' ')
    .toUpperCase();
}

function projectFreshness(project) {
  return project && project.index_metadata && project.index_metadata.freshness
    ? String(project.index_metadata.freshness).toUpperCase()
    : 'UNVERIFIED';
}

function renderProjectViewTabs(active) {
  const current = PROJECT_VIEWS.indexOf(active) >= 0 ? active : 'WORKSPACE';
  return '<div class="tabs project-tabs" role="tablist">' + PROJECT_VIEWS.map(function (view) {
    const label = view.charAt(0) + view.slice(1).toLowerCase();
    return '<button type="button" data-project-view="' + view + '" aria-pressed="' + (view === current) + '">' + label + '</button>';
  }).join('') + '</div>';
}

function parseReceiptJson(value) {
  if (typeof value !== 'string' || value.trim() === '') return null;
  try {
    const parsed = JSON.parse(value);
    return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : null;
  } catch (error) {
    return null;
  }
}

function latestSaveHistory(history) {
  const rows = Array.isArray(history) ? history : [];
  for (let i = rows.length - 1; i >= 0; i -= 1) {
    if (normalizeStateToken(rows[i].operation) === 'SAVE') return rows[i];
  }
  return null;
}

function projectSaveSyncHealth(project, history) {
  const freshness = projectFreshness(project);
  if (freshness === 'STALE') {
    return {
      state: 'STALE',
      detail: 'Project index is behind the canonical source.'
    };
  }

  const row = latestSaveHistory(history);
  if (!row) {
    return { state: 'Not provided', detail: 'No qualifying SAVE receipt is indexed.' };
  }

  if (normalizeStateToken(row.status) === 'FAILED') {
    return {
      state: 'FAILED',
      detail: row.failure_reason || 'Latest indexed SAVE failed.'
    };
  }

  const receipt = parseReceiptJson(row.receipt_json);
  if (
    normalizeStateToken(row.status) === 'SUCCESS' &&
    receipt &&
    receipt.status === 'SUCCESS' &&
    receipt.verified === true
  ) {
    let detail = receipt.adapter_outcome || 'Verified SAVE receipt';
    if (receipt.commit_or_record_id) detail += ' · ' + receipt.commit_or_record_id;
    else if (receipt.adapter_outcome === 'NO_CHANGE') detail += ' · no new commit required';
    else if (receipt.adapter_outcome === 'VERIFIED_WRITE_RECONCILED') detail += ' · no attributable commit SHA';
    return { state: 'SAVED', detail: detail };
  }

  return {
    state: 'Not provided',
    detail: 'Latest SAVE row is not sufficient to prove a verified SAVED state.'
  };
}

function renderProjectPulse(project, history) {
  const saveHealth = projectSaveSyncHealth(project, history);
  return '<section class="card pulse">' +
    '<h2>Project Pulse</h2>' +
    '<div class="pulse-grid">' +
      '<div><span class="pulse-label">Current stage</span><strong>' + textOrNotProvided(project.lifecycle_stage) + '</strong></div>' +
      '<div><span class="pulse-label">Next stage</span><strong>' + textOrNotProvided(project.next_stage) + '</strong></div>' +
      '<div><span class="pulse-label">Progress</span>' + renderProgress(project.progress) + '</div>' +
      '<div><span class="pulse-label">Index freshness</span><strong>' + escapeHtml(projectFreshness(project)) + '</strong></div>' +
      '<div><span class="pulse-label">Save / sync health</span><strong>' + escapeHtml(saveHealth.state) + '</strong>' +
        '<div class="muted">' + escapeHtml(saveHealth.detail) + '</div></div>' +
    '</div>' +
    '<div class="pulse-latest"><span class="pulse-label">Latest update</span>' + textOrNotProvided(project.latest_update) + '</div>' +
  '</section>';
}

function renderConversationContinuation(project) {
  return '<section class="card workspace-conversation">' +
    '<strong>Continue naturally</strong>' +
    '<p>Tell the AI what changed, what you are unsure about, or what you want to do next.</p>' +
    '<p class="muted">Route: ' + textOrNotProvided(project.ui_entry) + ' · opening the front door does not save or change project state.</p>' +
    '<p><a href="' + ASC_FRONT_DOOR_URL + '" target="_blank" rel="noopener">Open ASC Front Door</a></p>' +
  '</section>';
}

function firstReadyToLock(records) {
  const rows = Array.isArray(records) ? records : [];
  return rows.find(function (row) {
    return String(row.record_type || '').toLowerCase() === 'decision' &&
      READY_LOCK_STATUSES.indexOf(normalizeStateToken(row.status)) >= 0;
  }) || null;
}

function firstCurrentTask(rows) {
  const list = Array.isArray(rows) ? rows : [];
  return list.find(function (row) {
    return CURRENT_TASK_STATUSES.indexOf(normalizeStateToken(row.status)) >= 0 &&
      String(row.action || '').trim() !== '';
  }) || null;
}

function renderContextualCard(result) {
  const p = result.project;
  const freshness = projectFreshness(p);

  if (freshness === 'STALE') {
    return '<section class="card contextual-card state-warning">' +
      '<strong>Project state needs refresh</strong>' +
      '<p>The indexed project state is marked STALE, so ASC is not presenting a task or decision as current.</p>' +
      '<p class="muted">Use Review to inspect the factual indexed state.</p>' +
    '</section>';
  }

  const stage = normalizeStateToken(p.lifecycle_stage);
  if (DELIVERED_STAGES.indexOf(stage) >= 0) {
    return '<section class="card contextual-card delivered-card">' +
      '<strong>✅ DELIVERED !!</strong>' +
      '<p>' + textOrNotProvided(p.progress_summary || p.latest_update) + '</p>' +
    '</section>';
  }

  const ready = firstReadyToLock(result.records);
  if (ready) {
    return '<section class="card contextual-card ready-lock-card">' +
      '<strong>🔒 Ready to lock</strong>' +
      '<p>' + textOrNotProvided(ready.summary) + '</p>' +
      '<p class="muted">Owner confirmation is still required. This read-only workspace does not lock automatically.</p>' +
    '</section>';
  }

  const task = firstCurrentTask(result.action_plan);
  if (task) {
    return '<section class="card contextual-card current-task-card">' +
      '<strong>🚀 Current Task</strong>' +
      '<p>' + textOrNotProvided(task.action) + '</p>' +
      '<div><span class="pulse-label">Pass</span>' + textOrNotProvided(task.pass_condition) + '</div>' +
      '<div><span class="pulse-label">Then</span>' + textOrNotProvided(p.next_action_plan) + '</div>' +
    '</section>';
  }

  if (stage === 'DESIGN' && (
    (p.progress && p.progress.state === 'PROVIDED') ||
    String(p.progress_summary || '').trim() !== ''
  )) {
    const lockedDecisions = (Array.isArray(result.records) ? result.records : []).filter(function (row) {
      return String(row.record_type || '').toLowerCase() === 'decision' &&
        normalizeStateToken(row.status) === 'LOCKED';
    }).length;
    return '<section class="card contextual-card design-forming-card">' +
      '<strong>🎨 Design forming</strong>' +
      '<div>' + renderProgress(p.progress) + '</div>' +
      '<p>' + textOrNotProvided(p.progress_summary) + '</p>' +
      '<p class="muted">Locked decisions in current index: ' + escapeHtml(lockedDecisions) + '</p>' +
    '</section>';
  }

  return '<section class="card contextual-card">' +
    '<strong>No protected action needed right now</strong>' +
    '<p class="muted">ASC has no explicit Ready-to-Lock, Current Task, Design Forming, or Delivered state to surface.</p>' +
  '</section>';
}

function renderProjectWorkspace(result) {
  const p = result.project;
  return renderProjectPulse(p, result.history) +
    renderConversationContinuation(p) +
    renderContextualCard(result);
}

function renderProjectReview(result, ciResult) {
  const p = result.project;
  return '<section class="review-intro">' +
      '<p class="muted">Technical/project evidence is shown here on demand. Workspace remains the default.</p>' +
      renderIndexMeta(p.index_metadata) +
    '</section>' +
    renderZassCiStatus(p, ciResult) +
    renderSection('Progress summary', '<p>' + textOrNotProvided(p.progress_summary) + '</p>') +
    renderSection('Next Action Plan summary', '<p>' + textOrNotProvided(p.next_action_plan) + '</p>') +
    renderSection('Next stage summary', '<p>' + textOrNotProvided(p.next_stage) + '</p>') +
    renderSection('Action Plan', renderTable(ACTION_PLAN_COLUMNS, result.action_plan, 'No ACTION_PLAN rows for this project.')) +
    renderSection('ZASS / project records', renderTable(ZASS_COLUMNS, result.records, 'No RECORDS rows for this project.'));
}

function renderProjectHistory(result) {
  return renderSection('History', renderTable(HISTORY_COLUMNS, result.history, 'No HISTORY rows for this project.'));
}

function renderProjectDetail(result, ciResult, view) {
  if (!result || result.ok !== true) {
    return '<button type="button" class="back" data-back="1">← Back</button>' + renderError(result);
  }
  const p = result.project;
  const active = PROJECT_VIEWS.indexOf(view) >= 0 ? view : 'WORKSPACE';
  let body = '';
  if (active === 'REVIEW') body = renderProjectReview(result, ciResult);
  else if (active === 'HISTORY') body = renderProjectHistory(result);
  else body = renderProjectWorkspace(result);

  return '<button type="button" class="back" data-back="1">← Back</button>' +
    '<div class="project-heading"><h2>' + textOrNotProvided(p.project_name) + '</h2>' +
      '<span class="badge">' + textOrNotProvided(p.ui_entry) + '</span></div>' +
    renderProjectViewTabs(active) +
    body;
}

function dashboardRoot() { return document.getElementById('dashboard'); }

function showList() {
  dashboardState.projectResult = null;
  dashboardState.ciResult = null;
  dashboardState.projectView = 'WORKSPACE';
  dashboardRoot().innerHTML = renderProjectList(dashboardState.list, dashboardState.entry);
}

function showProject() {
  dashboardRoot().innerHTML = renderProjectDetail(
    dashboardState.projectResult,
    dashboardState.ciResult,
    dashboardState.projectView
  );
}

function openProject(projectId) {
  dashboardRoot().innerHTML = 'Loading project…';
  google.script.run
    .withSuccessHandler(function (result) {
      if (!result || result.ok !== true) {
        dashboardState.projectResult = result;
        dashboardRoot().innerHTML = renderProjectDetail(result);
        return;
      }

      dashboardState.projectResult = result;
      dashboardState.ciResult = null;
      dashboardState.projectView = 'WORKSPACE';
      showProject();

      const project = result.project || {};
      const repository = typeof project.github_repo === 'string' ? project.github_repo : '';
      const commitSha = project.index_metadata &&
        typeof project.index_metadata.source_commit === 'string'
        ? project.index_metadata.source_commit
        : '';

      if (!repository || !commitSha) {
        dashboardState.ciResult = {
          ok: true,
          repository: repository || null,
          commit_sha: commitSha || null,
          workflow_name: 'ZASS CI',
          job_name: 'zass-check',
          run_id: null,
          status: 'NOT_FOUND',
          conclusion: null,
          run_url: null,
          fetched_at: null
        };
        showProject();
        return;
      }

      google.script.run
        .withSuccessHandler(function (ciResult) {
          dashboardState.ciResult = ciResult;
          showProject();
        })
        .withFailureHandler(function () {
          dashboardState.ciResult = {
            ok: false,
            repository: repository,
            commit_sha: commitSha,
            workflow_name: 'ZASS CI',
            job_name: 'zass-check',
            run_id: null,
            status: 'READ_ERROR',
            conclusion: null,
            run_url: null,
            fetched_at: null,
            error: { code: 'SERVER_CALL_FAILED', message: 'CI status could not be loaded.' }
          };
          showProject();
        })
        .getDashboardZassCiStatus(repository, commitSha);
    })
    .withFailureHandler(function () {
      dashboardState.projectResult = { ok: false, error: { code: 'SERVER_CALL_FAILED', message: 'Project could not be loaded.' } };
      dashboardRoot().innerHTML = renderProjectDetail(dashboardState.projectResult);
    })
    .getDashboardProject(projectId);
}

function handleDashboardClick(event) {
  const target = event.target.closest('button');
  if (!target) return;
  if (target.dataset.entry) { dashboardState.entry = target.dataset.entry; showList(); return; }
  if (target.dataset.projectId !== undefined) { openProject(target.dataset.projectId); return; }
  if (target.dataset.projectView) {
    dashboardState.projectView = target.dataset.projectView;
    showProject();
    return;
  }
  if (target.dataset.back) { showList(); }
}

function bootDashboard() {
  dashboardRoot().addEventListener('click', handleDashboardClick);
  google.script.run
    .withSuccessHandler(function (result) { dashboardState.list = result; showList(); })
    .withFailureHandler(function () {
      dashboardState.list = { ok: false, error: { code: 'SERVER_CALL_FAILED', message: 'Dashboard could not be loaded.' } };
      showList();
    })
    .getDashboardProjects();
}

if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
  window.addEventListener('DOMContentLoaded', bootDashboard);
}
</script>
