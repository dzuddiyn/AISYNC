<script>
// T-009B/C — dashboard client. Pure render functions return HTML strings; values are
// escaped and shown exactly as provided by the read layer. No inference or calculation.

const DASHBOARD_ENTRIES = ['DUMP', 'DECIDE', 'DESIGN'];
const ASC_FRONT_DOOR_URL = 'https://dzuddiyn.github.io/AISYNC/asc/';
const NOT_PROVIDED = 'Not provided';
const PROJECT_VIEWS = ['WORKSPACE', 'REVIEW', 'HISTORY'];
const CURRENT_TASK_STATUSES = ['CURRENT', 'ACTIVE', 'IN PROGRESS', 'OPEN'];
const READY_LOCK_STATUSES = ['READY TO LOCK', 'PROPOSED FOR PROCEED'];
const DELIVERED_STAGES = ['DELIVERED', 'DELIVERED !!', 'COMPLETE', 'COMPLETED'];
const HANDOFF_PROVIDERS = ['ChatGPT', 'Gemini', 'Copilot'];
let dashboardState = {
  entry: 'DUMP',
  list: null,
  projectResult: null,
  ciResult: null,
  telemetryResult: null,
  continuityResult: null,
  projectView: 'WORKSPACE',
  handoffForm: { threadId: '', threadTitle: '', provider: '', route: 'DUMP', draft: '' },
  handoffResult: null,
  threadCreateResult: null,
  providerReturnText: '',
  methodReturnPreview: null,
  methodReturnSave: null,
  continuityAdvanceResult: null
};

function escapeHtml(value) {
  return String(value === undefined || value === null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function textOrNotProvided(value) {
  const text = value === undefined || value === null ? '' : String(value);
  return text.trim() === ''
    ? '<span class="not-provided">' + NOT_PROVIDED + '</span>'
    : escapeHtml(text);
}

function renderProgress(progress) {
  if (progress && progress.state === 'PROVIDED' && typeof progress.value === 'number') {
    return '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' +
      escapeHtml(progress.value) + '"><span style="width:' + escapeHtml(progress.value) + '%"></span></div>' +
      '<div class="muted">' + escapeHtml(progress.raw) + '</div>';
  }
  if (progress && progress.state === 'UNREADABLE') {
    return '<span class="not-provided">Progress value not displayable: ' + escapeHtml(progress.raw) + '</span>';
  }
  return '<span class="not-provided">Progress: ' + NOT_PROVIDED + '</span>';
}

function renderIndexMeta(meta) {
  if (!meta) return '';
  return '<div class="muted">Index source: ' + textOrNotProvided(meta.source_artifact) +
    ' · commit ' + textOrNotProvided(meta.source_commit) +
    ' · updated_at ' + textOrNotProvided(meta.updated_at) +
    ' · freshness ' + escapeHtml(meta.freshness || 'UNVERIFIED') + '</div>';
}

function renderZassCiStatus(project, ciResult) {
  const repository = project && typeof project.github_repo === 'string' ? project.github_repo : '';
  const commitSha = project && project.index_metadata &&
    typeof project.index_metadata.source_commit === 'string'
    ? project.index_metadata.source_commit
    : '';
  const identity = '<div class="muted">Repository: ' + textOrNotProvided(repository) +
    ' · commit ' + textOrNotProvided(commitSha) + '</div>';

  if (!repository || !commitSha) {
    return '<div class="card ci-status"><strong>Commit-linked ZASS CI</strong>' + identity +
      '<p class="not-provided">CI lookup not available because repository or commit metadata is missing.</p></div>';
  }

  if (!ciResult) {
    return '<div class="card ci-status"><strong>Commit-linked ZASS CI</strong>' + identity +
      '<p class="muted">Loading factual GitHub CI status…</p></div>';
  }

  const status = ciResult.status || 'READ_ERROR';
  let detail = '<div>Status: <strong>' + escapeHtml(status) + '</strong></div>' +
    '<div>Workflow / job: ' + textOrNotProvided(ciResult.workflow_name) +
    ' / ' + textOrNotProvided(ciResult.job_name) + '</div>' +
    '<div>Conclusion: ' + textOrNotProvided(ciResult.conclusion) + '</div>' +
    '<div>Run ID: ' + textOrNotProvided(ciResult.run_id) + '</div>' +
    '<div>Fetched at: ' + textOrNotProvided(ciResult.fetched_at) + '</div>';

  if (typeof ciResult.run_url === 'string' && /^https:\/\/\S+$/.test(ciResult.run_url)) {
    detail += '<div><a href="' + escapeHtml(ciResult.run_url) +
      '" target="_blank" rel="noopener">Open GitHub Actions run</a></div>';
  }

  if (status === 'NOT_FOUND') {
    detail += '<p class="muted">No matching ZASS CI result was found for this exact commit. This is not a PASS result.</p>';
  } else if (status === 'READ_ERROR') {
    const error = ciResult.error || {};
    detail += '<p class="error">CI read error' +
      (error.code ? ' (' + escapeHtml(error.code) + ')' : '') +
      (error.message ? ' — ' + escapeHtml(error.message) : '') + '</p>';
  }

  return '<div class="card ci-status"><strong>Commit-linked ZASS CI</strong>' + identity + detail + '</div>';
}

function renderError(result) {
  const error = (result && result.error) || { code: 'UNKNOWN', message: 'No result returned.' };
  let detail = '';
  if (result && result.tab) detail += ' Tab: ' + escapeHtml(result.tab) + '.';
  if (result && result.missing && result.missing.length) detail += ' Missing: ' + escapeHtml(result.missing.join(', ')) + '.';
  if (result && result.duplicate && result.duplicate.length) detail += ' Duplicate: ' + escapeHtml(result.duplicate.join(', ')) + '.';
  return '<p class="error">FAILED (' + escapeHtml(error.code) + ') — ' + escapeHtml(error.message) + detail + '</p>';
}

function renderEntryTabs(active) {
  return '<div class="tabs" role="tablist">' + DASHBOARD_ENTRIES.map(function (entry) {
    return '<button type="button" data-entry="' + entry + '" aria-pressed="' + (entry === active) + '">' + entry + '</button>';
  }).join('') + '</div>';
}

function renderProjectItem(project) {
  return '<button type="button" class="project" data-project-id="' + escapeHtml(project.project_id) + '">' +
    '<strong>' + textOrNotProvided(project.project_name) + '</strong>' +
    renderProgress(project.progress) +
    '<div>Latest update: ' + textOrNotProvided(project.latest_update) + '</div>' +
    renderIndexMeta(project.index_metadata) +
    '</button>';
}

function renderRouteIntro(active) {
  if (active !== 'DUMP') return '';
  return '<section class="card route-intro">' +
    '<strong>DUMP → ZASSPILL</strong>' +
    '<p class="muted">Start with natural conversation. ASC routes the handoff; ZASSPILL owns the method semantics.</p>' +
    '<p><a href="' + ASC_FRONT_DOOR_URL + '" target="_blank" rel="noopener">Open ASC Front Door</a></p>' +
    '</section>';
}

function renderProjectList(result, entry) {
  if (!result || result.ok !== true) return renderError(result);
  const active = DASHBOARD_ENTRIES.indexOf(entry) >= 0 ? entry : 'DUMP';
  const projects = (result.groups && result.groups[active]) || [];
  let html = renderEntryTabs(active) + renderRouteIntro(active);
  html += projects.length
    ? projects.map(renderProjectItem).join('')
    : '<p class="muted">No ' + active + ' projects in ASC DB.</p>';
  const unrecognized = result.unrecognized_ui_entry || [];
  if (unrecognized.length) {
    html += '<p class="muted">' + unrecognized.length + ' project row(s) have a ui_entry other than DUMP/DECIDE/DESIGN and are not grouped.</p>';
  }
  return html;
}

function renderCell(column, row) {
  const value = row[column];
  if (column === 'canonical_url' && typeof value === 'string' && /^https:\/\/\S+$/.test(value)) {
    return '<a href="' + escapeHtml(value) + '" target="_blank" rel="noopener">' + escapeHtml(value) + '</a>';
  }
  if (column === 'receipt_json' || column === 'lineage_json') {
    return value ? '<details><summary>show</summary><pre>' + escapeHtml(value) + '</pre></details>' : '';
  }
  return escapeHtml(value);
}

function renderTable(columns, rows, emptyText) {
  if (!Array.isArray(rows) || rows.length === 0) {
    return '<p class="muted">' + escapeHtml(emptyText) + '</p>';
  }
  return '<div class="table-wrap"><table><thead><tr>' +
    columns.map(function (c) { return '<th>' + escapeHtml(c) + '</th>'; }).join('') +
    '</tr></thead><tbody>' +
    rows.map(function (row) {
      return '<tr>' + columns.map(function (c) { return '<td>' + renderCell(c, row) + '</td>'; }).join('') + '</tr>';
    }).join('') +
    '</tbody></table></div>';
}

const ACTION_PLAN_COLUMNS = ['ap_id', 'status', 'action', 'dependencies', 'pass_condition', 'source_lineage', 'source_commit', 'updated_at'];
const ZASS_COLUMNS = ['record_type', 'record_id', 'status', 'summary', 'lineage_json', 'source_artifact', 'source_commit', 'canonical_url', 'updated_at'];
const HISTORY_COLUMNS = ['timestamp', 'request_id', 'operation', 'destination', 'status', 'affected_resource', 'commit_or_record_id', 'failure_reason', 'receipt_json'];

function renderSection(title, body) {
  return '<section class="card"><h2>' + escapeHtml(title) + '</h2>' + body + '</section>';
}

function normalizeStateToken(value) {
  return String(value === undefined || value === null ? '' : value)
    .trim()
    .replace(/_/g, ' ')
    .replace(/\s+/g, ' ')
    .toUpperCase();
}

function projectFreshness(project) {
  return project && project.index_metadata && project.index_metadata.freshness
    ? String(project.index_metadata.freshness).toUpperCase()
    : 'UNVERIFIED';
}

function renderProjectViewTabs(active) {
  const current = PROJECT_VIEWS.indexOf(active) >= 0 ? active : 'WORKSPACE';
  return '<div class="tabs project-tabs" role="tablist">' + PROJECT_VIEWS.map(function (view) {
    const label = view.charAt(0) + view.slice(1).toLowerCase();
    return '<button type="button" data-project-view="' + view + '" aria-pressed="' + (view === current) + '">' + label + '</button>';
  }).join('') + '</div>';
}

function parseReceiptJson(value) {
  if (typeof value !== 'string' || value.trim() === '') return null;
  try {
    const parsed = JSON.parse(value);
    return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : null;
  } catch (error) {
    return null;
  }
}

function latestSaveHistory(history) {
  const rows = Array.isArray(history) ? history : [];
  for (let i = rows.length - 1; i >= 0; i -= 1) {
    if (normalizeStateToken(rows[i].operation) === 'SAVE') return rows[i];
  }
  return null;
}

function projectSaveSyncHealth(project, history) {
  const freshness = projectFreshness(project);
  if (freshness === 'STALE') {
    return {
      state: 'STALE',
      detail: 'Project index is behind the canonical source.'
    };
  }

  const row = latestSaveHistory(history);
  if (!row) {
    return { state: 'Not provided', detail: 'No qualifying SAVE receipt is indexed.' };
  }

  if (normalizeStateToken(row.status) === 'FAILED') {
    return {
      state: 'FAILED',
      detail: row.failure_reason || 'Latest indexed SAVE failed.'
    };
  }

  const receipt = parseReceiptJson(row.receipt_json);
  if (
    normalizeStateToken(row.status) === 'SUCCESS' &&
    receipt &&
    receipt.status === 'SUCCESS' &&
    receipt.verified === true
  ) {
    let detail = receipt.adapter_outcome || 'Verified SAVE receipt';
    if (receipt.commit_or_record_id) detail += ' · ' + receipt.commit_or_record_id;
    else if (receipt.adapter_outcome === 'NO_CHANGE') detail += ' · no new commit required';
    else if (receipt.adapter_outcome === 'VERIFIED_WRITE_RECONCILED') detail += ' · no attributable commit SHA';
    return { state: 'SAVED', detail: detail };
  }

  return {
    state: 'Not provided',
    detail: 'Latest SAVE row is not sufficient to prove a verified SAVED state.'
  };
}

function renderProjectPulse(project, history) {
  const saveHealth = projectSaveSyncHealth(project, history);
  return '<section class="card pulse">' +
    '<h2>Project Pulse</h2>' +
    '<div class="pulse-grid">' +
      '<div><span class="pulse-label">Current stage</span><strong>' + textOrNotProvided(project.lifecycle_stage) + '</strong></div>' +
      '<div><span class="pulse-label">Next stage</span><strong>' + textOrNotProvided(project.next_stage) + '</strong></div>' +
      '<div><span class="pulse-label">Progress</span>' + renderProgress(project.progress) + '</div>' +
      '<div><span class="pulse-label">Index freshness</span><strong>' + escapeHtml(projectFreshness(project)) + '</strong></div>' +
      '<div><span class="pulse-label">Save / sync health</span><strong>' + escapeHtml(saveHealth.state) + '</strong>' +
        '<div class="muted">' + escapeHtml(saveHealth.detail) + '</div></div>' +
    '</div>' +
    '<div class="pulse-latest"><span class="pulse-label">Latest update</span>' + textOrNotProvided(project.latest_update) + '</div>' +
  '</section>';
}

function handoffValueText(value) {
  if (value === undefined || value === null) return '';
  if (typeof value === 'string') return value;
  try { return JSON.stringify(value); } catch (error) { return String(value); }
}

function renderThreadOptions(continuityResult, selectedThreadId) {
  if (!continuityResult) return '<option value="">Loading project conversations…</option>';
  if (continuityResult.ok !== true) return '<option value="">Project conversations unavailable</option>';
  const threads = Array.isArray(continuityResult.threads) ? continuityResult.threads : [];
  if (!threads.length) return '<option value="">No saved project conversation yet</option>';
  const prefix = threads.length > 1 ? '<option value="">Choose a conversation</option>' : '';
  return prefix + threads.map(function (thread) {
    const title = handoffValueText(thread.title).trim() || 'Untitled thread';
    const current = handoffValueText(thread.current).trim();
    const label = current ? title + ' — ' + current : title;
    return '<option value="' + escapeHtml(thread.thread_id) + '"' +
      (thread.thread_id === selectedThreadId ? ' selected' : '') + '>' + escapeHtml(label) + '</option>';
  }).join('');
}

function renderProviderReturn(returnText, preview, saveResult) {
  let previewHtml = '<p class="muted">Paste the complete result returned by the AI after you ask it to SAVE. AISYNC will check it before preparing a SAVE.</p>';
  let actions = '<button type="button" data-handoff-action="preview-return">CHECK AI RESULT</button>';

  if (preview && preview.ok === true) {
    previewHtml += '<div class="return-preview">' +
      '<div><span class="pulse-label">Method</span>' + escapeHtml(preview.producing_method) + '</div>' +
      '<div><span class="pulse-label">Source revision</span>' + escapeHtml(preview.source_revision) + '</div>' +
      '<div><span class="pulse-label">Record ID</span>' + escapeHtml(preview.record_id) + '</div>' +
      '<div><span class="pulse-label">Confirmed outcome</span>' + escapeHtml(preview.confirmed_outcome) + '</div>' +
      '<div><span class="pulse-label">Still open</span>' + escapeHtml(handoffValueText(preview.still_open)) + '</div>' +
      '</div>';
    actions += '<button type="button" data-handoff-action="prepare-save">PREPARE SAVE</button>';
  } else if (preview && preview.ok === false) {
    previewHtml += '<p class="error">RETURN REJECTED (' +
      escapeHtml(preview.error && preview.error.code || 'UNKNOWN') + ') — ' +
      escapeHtml(preview.error && preview.error.message || 'Provider return could not be validated.') + '</p>';
  }

  if (saveResult && saveResult.ok === true) {
    previewHtml += '<p class="muted">Your SAVE is ready for review. Nothing has been saved yet. Open it, check the preview, then use CONFIRM & SYNC.</p>';
    actions += '<button type="button" data-handoff-action="open-save">REVIEW & SAVE</button>';
  } else if (saveResult && saveResult.ok === false) {
    previewHtml += '<p class="error">SAVE PREPARE FAILED (' +
      escapeHtml(saveResult.error && saveResult.error.code || 'UNKNOWN') + ') — ' +
      escapeHtml(saveResult.error && saveResult.error.message || 'ASC SAVE could not be prepared.') + '</p>';
  }

  return '<div class="provider-return">' +
    '<strong>Return from AI</strong>' +
    previewHtml +
    '<label>AI result<textarea id="project-provider-return" maxlength="12000" placeholder="Paste the complete result returned by the AI here.">' +
      escapeHtml(returnText || '') + '</textarea></label>' +
    '<div class="handoff-actions">' + actions + '</div>' +
  '</div>';
}

function renderPendingSavedResult(continuityResult, advanceResult) {
  const pending = continuityResult && continuityResult.ok === true &&
    Array.isArray(continuityResult.pending_saved_results)
    ? continuityResult.pending_saved_results
    : [];
  if (advanceResult && advanceResult.ok === true) {
    return '<section class="card saved-result-advance">' +
      '<strong>Saved result is now the current project context</strong>' +
      '<p>Your project conversation moved to the verified saved result.</p>' +
      '<div><span class="pulse-label">Current</span>' + escapeHtml(advanceResult.current) + '</div>' +
      '<p class="muted">The next AI conversation will use this newer project context.</p>' +
    '</section>';
  }

  if (advanceResult && advanceResult.ok === false) {
    return '<section class="card saved-result-advance">' +
      '<strong>Saved result not applied</strong>' +
      '<p class="error">' + escapeHtml(advanceResult.error && advanceResult.error.code || 'UNKNOWN') +
      ' — ' + escapeHtml(advanceResult.error && advanceResult.error.message || 'Continuity advance failed.') + '</p>' +
    '</section>';
  }

  if (!pending.length) return '';

  return '<section class="card saved-result-advance">' +
    '<strong>Saved result ready to continue</strong>' +
    (pending.length > 1
      ? '<p class="muted">More than one verified saved result is waiting. Choose the exact result to apply; ASC will not choose for you.</p>'
      : '') +
    pending.map(function (item) {
      return '<article class="saved-result-item">' +
        '<p>This SAVE is verified, but your project conversation has not moved to it yet.</p>' +
        '<div><span class="pulse-label">Confirmed outcome</span>' + escapeHtml(item.confirmed_outcome) + '</div>' +
        '<div><span class="pulse-label">Saved artifact</span>' + escapeHtml(item.record_id) + '</div>' +
        '<button type="button" data-handoff-action="advance-saved-result" data-handoff-id="' +
          escapeHtml(item.handoff_id) + '">USE SAVED RESULT TO CONTINUE</button>' +
      '</article>';
    }).join('') +
    '<p class="muted">This only updates the project\'s private continuity checkpoint. It does not perform another SAVE.</p>' +
  '</section>';
}

function renderProjectContinuation(project, continuityResult, handoffForm, handoffResult, threadCreateResult) {
  const form = handoffForm || { threadId: '', threadTitle: '', provider: '', route: 'DUMP', draft: '' };
  const threads = continuityResult && continuityResult.ok === true && Array.isArray(continuityResult.threads)
    ? continuityResult.threads
    : null;
  const noThreads = Array.isArray(threads) && threads.length === 0;
  const route = DASHBOARD_ENTRIES.indexOf(form.route) >= 0 ? form.route : 'DUMP';
  const providerOptions = '<option value="">Choose AI provider</option>' + HANDOFF_PROVIDERS.map(function (provider) {
    return '<option value="' + provider + '"' + (provider === form.provider ? ' selected' : '') + '>' + provider + '</option>';
  }).join('');
  const routeOptions = [
    ['DUMP', 'DUMP — just talk'],
    ['DECIDE', 'DECIDE — help me choose'],
    ['DESIGN', 'DESIGN — help me build']
  ].map(function (item) {
    return '<option value="' + item[0] + '"' + (item[0] === route ? ' selected' : '') + '>' + item[1] + '</option>';
  }).join('');

  let status = noThreads
    ? '<p id="project-handoff-status" class="muted">No saved project conversation exists yet. START PROJECT CONVERSATION creates a private continuity checkpoint for this project; it does not publish or SAVE the project.</p>'
    : '<p id="project-handoff-status" class="muted">Preparing or opening an AI conversation does not SAVE the project.</p>';
  let actions = noThreads
    ? '<button type="button" data-handoff-action="start-thread">START PROJECT CONVERSATION</button>'
    : '<button type="button" data-handoff-action="prepare">PREPARE FOR AI</button>';
  if (threadCreateResult && threadCreateResult.ok === true) {
    status = '<p id="project-handoff-status" class="muted">Project conversation started. It is ready to continue with an AI.</p>';
  } else if (threadCreateResult && threadCreateResult.ok === false) {
    status = '<p id="project-handoff-status" class="error">FAILED (' + escapeHtml(threadCreateResult.error && threadCreateResult.error.code || 'UNKNOWN') +
      ') — ' + escapeHtml(threadCreateResult.error && threadCreateResult.error.message || 'Project conversation could not be started.') + '</p>';
  }
  const firstThreadFields = noThreads
    ? '<label>Conversation title<input id="project-thread-title" maxlength="200" placeholder="Name this project conversation" value="' + escapeHtml(form.threadTitle) + '"></label>'
    : '';

  if (handoffResult && handoffResult.ok === true) {
    status = '<p id="project-handoff-status" class="muted">Ready for ' + escapeHtml(handoffResult.provider) +
      '. Copy the prepared text, then open the AI.</p>';
    actions += '<button type="button" data-handoff-action="copy">COPY FOR AI</button>' +
      '<button type="button" data-handoff-action="show">SHOW PREPARED TEXT</button>' +
      '<button type="button" data-handoff-action="open">OPEN ' + escapeHtml(handoffResult.provider).toUpperCase() + '</button>';
  } else if (handoffResult && handoffResult.ok === false) {
    status = '<p id="project-handoff-status" class="error">FAILED (' + escapeHtml(handoffResult.error && handoffResult.error.code || 'UNKNOWN') +
      ') — ' + escapeHtml(handoffResult.error && handoffResult.error.message || 'Handoff could not be prepared.') + '</p>';
  }

  const returnSection = handoffResult && handoffResult.ok === true
    ? renderProviderReturn(dashboardState.providerReturnText, dashboardState.methodReturnPreview, dashboardState.methodReturnSave)
    : '';

  return '<section class="card workspace-conversation">' +
    '<strong>Continue this project</strong>' +
    '<p>Choose a project conversation, AI provider and help mode, then say what changed or what you want to do next.</p>' +
    '<p class="muted">AISYNC sends only the minimum context needed for the selected project conversation. Memory held by the AI provider is not imported.</p>' +
    '<div class="handoff-grid">' +
      '<label>Conversation<select id="project-thread">' + renderThreadOptions(continuityResult, form.threadId) + '</select></label>' +
      firstThreadFields +
      '<label>AI provider<select id="project-provider">' + providerOptions + '</select></label>' +
      '<label>Help mode<select id="project-route">' + routeOptions + '</select></label>' +
    '</div>' +
    '<label>What next?<textarea id="project-draft" maxlength="4000" placeholder="Tell the AI what changed, what you are unsure about, or what you want to do next.">' + escapeHtml(form.draft) + '</textarea></label>' +
    status + '<div class="handoff-actions">' + actions + '</div>' +
    '<div id="project-handoff-manual" class="handoff-manual" hidden><p class="muted">If copy does not work, manually copy this prepared text into the selected AI.</p><pre id="project-handoff-manual-text"></pre></div>' +
    returnSection +
    '<p class="muted">Need a new conversation instead? <a href="' + ASC_FRONT_DOOR_URL + '" target="_blank" rel="noopener">Open ASC Front Door</a>.</p>' +
  '</section>';
}

function firstReadyToLock(records) {
  const rows = Array.isArray(records) ? records : [];
  return rows.find(function (row) {
    return String(row.record_type || '').toLowerCase() === 'decision' &&
      READY_LOCK_STATUSES.indexOf(normalizeStateToken(row.status)) >= 0;
  }) || null;
}

function firstCurrentTask(rows) {
  const list = Array.isArray(rows) ? rows : [];
  return list.find(function (row) {
    return CURRENT_TASK_STATUSES.indexOf(normalizeStateToken(row.status)) >= 0 &&
      String(row.action || '').trim() !== '';
  }) || null;
}

function renderContextualCard(result) {
  const p = result.project;
  const freshness = projectFreshness(p);

  if (freshness === 'STALE') {
    return '<section class="card contextual-card state-warning">' +
      '<strong>Project state needs refresh</strong>' +
      '<p>The indexed project state is marked STALE, so ASC is not presenting a task or decision as current.</p>' +
      '<p class="muted">Use Review to inspect the factual indexed state.</p>' +
    '</section>';
  }

  const stage = normalizeStateToken(p.lifecycle_stage);
  if (DELIVERED_STAGES.indexOf(stage) >= 0) {
    return '<section class="card contextual-card delivered-card">' +
      '<strong>✅ DELIVERED !!</strong>' +
      '<p>' + textOrNotProvided(p.progress_summary || p.latest_update) + '</p>' +
    '</section>';
  }

  const ready = firstReadyToLock(result.records);
  if (ready) {
    return '<section class="card contextual-card ready-lock-card">' +
      '<strong>🔒 Ready to lock</strong>' +
      '<p>' + textOrNotProvided(ready.summary) + '</p>' +
      '<p class="muted">Owner confirmation is still required. This read-only workspace does not lock automatically.</p>' +
    '</section>';
  }

  const task = firstCurrentTask(result.action_plan);
  if (task) {
    return '<section class="card contextual-card current-task-card">' +
      '<strong>🚀 Current Task</strong>' +
      '<p>' + textOrNotProvided(task.action) + '</p>' +
      '<div><span class="pulse-label">Pass</span>' + textOrNotProvided(task.pass_condition) + '</div>' +
      '<div><span class="pulse-label">Then</span>' + textOrNotProvided(p.next_action_plan) + '</div>' +
    '</section>';
  }

  if (stage === 'DESIGN' && (
    (p.progress && p.progress.state === 'PROVIDED') ||
    String(p.progress_summary || '').trim() !== ''
  )) {
    const lockedDecisions = (Array.isArray(result.records) ? result.records : []).filter(function (row) {
      return String(row.record_type || '').toLowerCase() === 'decision' &&
        normalizeStateToken(row.status) === 'LOCKED';
    }).length;
    return '<section class="card contextual-card design-forming-card">' +
      '<strong>🎨 Design forming</strong>' +
      '<div>' + renderProgress(p.progress) + '</div>' +
      '<p>' + textOrNotProvided(p.progress_summary) + '</p>' +
      '<p class="muted">Locked decisions in current index: ' + escapeHtml(lockedDecisions) + '</p>' +
    '</section>';
  }

  return '<section class="card contextual-card">' +
    '<strong>No protected action needed right now</strong>' +
    '<p class="muted">ASC has no explicit Ready-to-Lock, Current Task, Design Forming, or Delivered state to surface.</p>' +
  '</section>';
}

function renderProjectWorkspace(result) {

    renderProjectContinuation(p, dashboardState.continuityResult, dashboardState.handoffForm, dashboardState.handoffResult, dashboardState.threadCreateResult) +
    renderPendingSavedResult(dashboardState.continuityResult, dashboardState.continuityAdvanceResult) +
    renderContextualCard(result);
}


function recordTypeToken(value) {
  return normalizeStateToken(value);
}

function recordsOfTypes(records, types) {
  const allowed = Array.isArray(types) ? types : [];
  return (Array.isArray(records) ? records : []).filter(function (row) {
    return allowed.indexOf(recordTypeToken(row.record_type)) >= 0;
  });
}

function parseLineageArray(value) {
  const raw = value === undefined || value === null ? '' : String(value);
  if (raw.trim() === '') return { state: 'EMPTY', values: [], raw: raw };
  try {
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return { state: 'UNREADABLE', values: [], raw: raw };
    return {
      state: 'OK',
      values: parsed.map(function (item) {
        if (typeof item === 'string' || typeof item === 'number' || typeof item === 'boolean') return String(item);
        return JSON.stringify(item);
      }),
      raw: raw
    };
  } catch (error) {
    return { state: 'UNREADABLE', values: [], raw: raw };
  }
}

function renderReadableLineage(value) {
  const parsed = parseLineageArray(value);
  if (parsed.state === 'EMPTY') return '<span class="not-provided">No lineage provided.</span>';
  if (parsed.state === 'UNREADABLE') {
    return '<details><summary>Unreadable lineage — show raw</summary><pre>' + escapeHtml(parsed.raw) + '</pre></details>';
  }
  if (parsed.values.length === 0) return '<span class="muted">[]</span>';
  return '<ul class="lineage-list">' + parsed.values.map(function (item) {
    return '<li>' + escapeHtml(item) + '</li>';
  }).join('') + '</ul>';
}

function renderRecordCategory(title, rows, emptyText) {
  const columns = ['record_id', 'status', 'summary', 'source_artifact', 'source_commit', 'canonical_url', 'updated_at'];
  return renderSection(title, renderTable(columns, rows, emptyText));
}

function renderReviewOverview(project) {

      '<div><span class="pulse-label">Next Action Plan</span>' + textOrNotProvided(project.next_action_plan) + '</div>' +
      '<div><span class="pulse-label">Next stage</span>' + textOrNotProvided(project.next_stage) + '</div>' +
    '</div>' +

}

function renderLineageSources(result) {
  const records = Array.isArray(result.records) ? result.records : [];
  const actionPlan = Array.isArray(result.action_plan) ? result.action_plan : [];
  const items = [];

  records.forEach(function (row) {
    if (
      String(row.lineage_json || '').trim() === '' &&
      String(row.source_artifact || '').trim() === '' &&
      String(row.source_commit || '').trim() === '' &&
      String(row.canonical_url || '').trim() === ''
    ) return;

    let source = '<div class="muted">Source: ' + textOrNotProvided(row.source_artifact) +
      ' · commit ' + textOrNotProvided(row.source_commit) + '</div>';
    if (typeof row.canonical_url === 'string' && /^https:\/\/\S+$/.test(row.canonical_url)) {
      source += '<div><a href="' + escapeHtml(row.canonical_url) + '" target="_blank" rel="noopener">Open canonical source</a></div>';
    }
    items.push('<article class="review-item">' +
      '<strong>' + textOrNotProvided(row.record_id) + '</strong>' +
      '<div><span class="pulse-label">Lineage</span>' + renderReadableLineage(row.lineage_json) + '</div>' +
      source +
    '</article>');
  });

  actionPlan.forEach(function (row) {
    if (
      String(row.source_lineage || '').trim() === '' &&
      String(row.source_artifact || '').trim() === '' &&
      String(row.source_commit || '').trim() === ''
    ) return;
    items.push('<article class="review-item">' +
      '<strong>' + textOrNotProvided(row.ap_id) + '</strong>' +
      '<div><span class="pulse-label">Source lineage</span>' + textOrNotProvided(row.source_lineage) + '</div>' +
      '<div class="muted">Source: ' + textOrNotProvided(row.source_artifact) +
        ' · commit ' + textOrNotProvided(row.source_commit) + '</div>' +

  return renderSection(
    'Lineage / sources',
    items.length ? '<div class="review-stack">' + items.join('') + '</div>' :
      '<p class="muted">No lineage/source metadata indexed for this project.</p>'
  );
}

function isGitShaLike(value) {
  return /^[0-9a-f]{7,40}$/i.test(String(value || '').trim());
}

function validGithubRepo(value) {
  return /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(String(value || '').trim());
}

function collectCommitTrail(result) {
  const project = result.project || {};
  const repo = String(project.github_repo || '');
  const rows = [];
  const byCommit = {};

  function add(commit, provenance, artifact, timestamp) {
    const token = String(commit || '').trim();
    if (!token) return;
    if (!byCommit[token]) {
      byCommit[token] = {
        commit: token,
        provenance: [],
        artifacts: [],
        timestamps: [],
        url: validGithubRepo(repo) && isGitShaLike(token)
          ? 'https://github.com/' + repo + '/commit/' + token
          : ''
      };
      rows.push(byCommit[token]);
    }
    const item = byCommit[token];
    if (provenance && item.provenance.indexOf(provenance) < 0) item.provenance.push(provenance);
    if (artifact && item.artifacts.indexOf(artifact) < 0) item.artifacts.push(artifact);
    if (timestamp && item.timestamps.indexOf(timestamp) < 0) item.timestamps.push(timestamp);
  }

  if (project.index_metadata) {
    add(
      project.index_metadata.source_commit,
      'Project index',
      project.index_metadata.source_artifact,
      project.index_metadata.updated_at
    );
  }

  (Array.isArray(result.records) ? result.records : []).forEach(function (row) {
    add(row.source_commit, 'Record ' + String(row.record_id || ''), row.source_artifact, row.updated_at);
  });

  (Array.isArray(result.action_plan) ? result.action_plan : []).forEach(function (row) {
    add(row.source_commit, 'Action Plan ' + String(row.ap_id || ''), row.source_artifact, row.updated_at);
  });

  (Array.isArray(result.history) ? result.history : []).forEach(function (row) {
    add(row.source_commit, 'History source ' + String(row.request_id || ''), row.affected_resource, row.timestamp);
    if (isGitShaLike(row.commit_or_record_id)) {
      add(row.commit_or_record_id, 'History result ' + String(row.request_id || ''), row.affected_resource, row.timestamp);
    }
  });

  return rows;
}

function renderCommitTrail(result) {
  const rows = collectCommitTrail(result);
  if (!rows.length) {
    return renderSection('Commit / version trail', '<p class="muted">No explicit commit/version identifiers indexed for this project.</p>');
  }
  const html = '<div class="review-stack">' + rows.map(function (row) {
    const commit = row.url
      ? '<a href="' + escapeHtml(row.url) + '" target="_blank" rel="noopener">' + escapeHtml(row.commit) + '</a>'
      : escapeHtml(row.commit);
    return '<article class="review-item">' +
      '<strong>' + commit + '</strong>' +
      '<div><span class="pulse-label">Provenance</span>' + escapeHtml(row.provenance.join(' · ')) + '</div>' +
      '<div><span class="pulse-label">Artifacts/resources</span>' +
        (row.artifacts.length ? escapeHtml(row.artifacts.join(' · ')) : '<span class="not-provided">Not provided</span>') + '</div>' +
      '<div><span class="pulse-label">Indexed timestamps</span>' +
        (row.timestamps.length ? escapeHtml(row.timestamps.join(' · ')) : '<span class="not-provided">Not provided</span>') + '</div>' +
    '</article>';
  }).join('') + '</div>';
  return renderSection('Commit / version trail', html);
}

function receiptAuditSummary(row) {
  const receipt = parseReceiptJson(row && row.receipt_json);
  if (!receipt) {
    return {
      summary: '<span class="not-provided">No parseable receipt summary.</span>',
      raw: row && row.receipt_json ? String(row.receipt_json) : ''
    };
  }
  const performed = receipt.write_performed === true ? 'yes'
    : (receipt.write_performed === false ? 'no' : 'unknown');
  let html = '<div class="receipt-audit">' +
    '<div>Outcome: ' + textOrNotProvided(receipt.adapter_outcome) + '</div>' +
    '<div>Verified: <strong>' + escapeHtml(receipt.verified === true ? 'true' : 'false') + '</strong></div>' +
    '<div>Write performed: ' + escapeHtml(performed) + '</div>' +
    '<div>Commit / record: ' + textOrNotProvided(receipt.commit_or_record_id || row.commit_or_record_id) + '</div>' +
  '</div>';
  return { summary: html, raw: String(row.receipt_json || '') };
}

function renderHistoryAudit(history) {
  const rows = Array.isArray(history) ? history : [];
  if (!rows.length) return '<p class="muted">No HISTORY rows for this project.</p>';

  return '<div class="audit-stack">' + rows.map(function (row) {
    const receipt = receiptAuditSummary(row);
    const failure = String(row.failure_reason || '').trim()
      ? '<p class="error">Failure: ' + escapeHtml(row.failure_reason) + '</p>'
      : '';
    const raw = receipt.raw
      ? '<details><summary>Raw receipt JSON</summary><pre>' + escapeHtml(receipt.raw) + '</pre></details>'
      : '';
    return '<article class="audit-event">' +
      '<div class="audit-heading"><strong>' + textOrNotProvided(row.operation) + '</strong>' +
        '<span class="badge">' + textOrNotProvided(row.status) + '</span></div>' +
      '<div class="muted">' + textOrNotProvided(row.timestamp) +
        ' · request ' + textOrNotProvided(row.request_id) +
        ' · destination ' + textOrNotProvided(row.destination) + '</div>' +
      '<div><span class="pulse-label">Affected resource</span>' + textOrNotProvided(row.affected_resource) + '</div>' +
      '<div><span class="pulse-label">Commit / record</span>' + textOrNotProvided(row.commit_or_record_id) + '</div>' +
      failure +
      receipt.summary +
      raw +
    '</article>';
  }).join('') + '</div>';
}

function telemetryDetailsHtml(probe) {
  const details = probe && probe.details && typeof probe.details === 'object' ? probe.details : {};
  const fields = [
    ['authority', 'Authority'],
    ['tabs_read', 'Tabs read'],
    ['repository', 'Repository'],
    ['ref', 'Ref'],
    ['commit_sha', 'Canonical commit'],
    ['indexed_ref', 'Indexed ref'],
    ['indexed_commit', 'Indexed commit'],
    ['reason', 'Reason'],
    ['schema_version', 'Schema'],
    ['project_count', 'Project count'],
    ['project_present', 'Project present'],
    ['token_issued', 'Token issued'],
    ['token_expires_at', 'Token expires'],
    ['repository_write_performed', 'Repository write performed'],
    ['event_timestamp', 'Event timestamp'],
    ['row_status', 'Indexed SAVE status'],
    ['adapter_outcome', 'Adapter outcome'],
    ['verified', 'Verified'],
    ['write_performed', 'Write performed'],
    ['failure_reason', 'Failure reason'],
    ['note', 'Note']
  ];
  const rows = fields.map(function (item) {
    const value = details[item[0]];
    if (value === undefined || value === null || value === '') return '';
    const display = Array.isArray(value) ? value.join(', ') : String(value);
    return '<div><span class="pulse-label">' + escapeHtml(item[1]) + '</span>' +
      escapeHtml(display) + '</div>';
  }).join('');
  return rows ? '<div class="review-current-state">' + rows + '</div>' : '';
}

function renderProductionTelemetry(result) {
  if (result === null || result === undefined) {
    return '<section class="card">' +
      '<h2>Operator telemetry</h2>' +
      '<p class="muted">Loading a fresh read-only telemetry snapshot…</p>' +
    '</section>';
  }

  if (result.ok !== true) {
    const code = result.error && result.error.code ? result.error.code : 'TELEMETRY_UNAVAILABLE';
    const message = result.error && result.error.message ? result.error.message : 'Production telemetry could not be loaded.';
    return '<section class="card">' +
      '<h2>Operator telemetry</h2>' +
      '<p class="error">FAILED (' + escapeHtml(code) + ') — ' + escapeHtml(message) + '</p>' +
      '<button type="button" data-telemetry-action="refresh">REFRESH TELEMETRY</button>' +
    '</section>';
  }

  const probes = result.probes && typeof result.probes === 'object' ? result.probes : {};
  const order = [
    ['asc_db', 'ASC DB'],
    ['canonical_github', 'Canonical GitHub'],
    ['index_freshness', 'Index freshness'],
    ['private_continuity', 'Private continuity'],
    ['github_app_auth', 'GitHub App auth'],
    ['latest_save', 'Latest SAVE evidence']
  ];
  const cards = order.map(function (item) {
    const probe = probes[item[0]] || {};
    const error = probe.error
      ? '<p class="error">(' + escapeHtml(probe.error.code || 'UNKNOWN') + ') ' +
          escapeHtml(probe.error.message || 'Probe failed.') + '</p>'
      : '';
    return '<article class="review-item">' +
      '<strong>' + escapeHtml(item[1]) + ' · ' + escapeHtml(probe.state || 'NOT_OBSERVED') + '</strong>' +
      '<div class="muted">Source: ' + escapeHtml(probe.source || 'Not provided') +
        ' · observed ' + escapeHtml(probe.observed_at || 'Not provided') + '</div>' +
      error +
      telemetryDetailsHtml(probe) +
    '</article>';
  }).join('');

  return '<section class="card">' +
    '<h2>Operator telemetry</h2>' +
    '<p><strong>' + escapeHtml(result.overall && result.overall.state || 'UNKNOWN') + '</strong> — ' +
      escapeHtml(result.overall && result.overall.reason || 'No overall reason provided.') + '</p>' +
    '<p class="muted">Snapshot ' + escapeHtml(result.observed_at || 'Not provided') +
      '. Ephemeral and read-only: it is not stored as telemetry. UNKNOWN / UNVERIFIED / NOT_OBSERVED are never treated as PASS. Secret values are not returned.</p>' +
    '<div class="review-stack">' + cards + '</div>' +
    '<div class="handoff-actions"><button type="button" data-telemetry-action="refresh">REFRESH TELEMETRY</button></div>' +
  '</section>';
}

function renderProjectReview(result, ciResult, telemetryResult) {
  const p = result.project;
  const records = Array.isArray(result.records) ? result.records : [];
  const decisions = recordsOfTypes(records, ['DECISION']);
  const design = recordsOfTypes(records, ['DESIGN', 'ARCHITECTURE', 'DESIGN RECORD']);
  const selection = recordsOfTypes(records, ['SELECTION', 'SELECTION MATRIX', 'MATRIX']);

  return '<section class="review-intro">' +
      '<p class="muted">Review is read-only indexed evidence. Workspace remains the default working surface.</p>' +
    '</section>' +
    renderProductionTelemetry(telemetryResult) +
    renderReviewOverview(p) +
    renderZassCiStatus(p, ciResult) +
    renderRecordCategory('Decisions', decisions, 'No decisions indexed for this project.') +
    renderRecordCategory('Design / architecture', design, 'No design/architecture records indexed.') +
    renderRecordCategory('Selection state', selection, 'No selection state indexed.') +
    renderSection('Action Plan', renderTable(ACTION_PLAN_COLUMNS, result.action_plan, 'No ACTION_PLAN rows for this project.')) +
    renderLineageSources(result) +
    renderCommitTrail(result) +
    '<details class="raw-details"><summary>Raw project records</summary>' +
      renderTable(ZASS_COLUMNS, records, 'No RECORDS rows for this project.') +
    '</details>';
}

function renderProjectHistory(result) {
  return renderSection('History', renderHistoryAudit(result.history));
}

function renderProjectDetail(result, ciResult, view, telemetryResult) {
  if (!result || result.ok !== true) {
    return '<button type="button" class="back" data-back="1">← Back</button>' + renderError(result);
  }
  const p = result.project;
  const active = PROJECT_VIEWS.indexOf(view) >= 0 ? view : 'WORKSPACE';
  let body = '';
  if (active === 'REVIEW') body = renderProjectReview(result, ciResult, telemetryResult);
  else if (active === 'HISTORY') body = renderProjectHistory(result);
  else body = renderProjectWorkspace(result);

  return '<button type="button" class="back" data-back="1">← Back</button>' +
    '<div class="project-heading"><h2>' + textOrNotProvided(p.project_name) + '</h2>' +
      '<span class="badge">' + textOrNotProvided(p.ui_entry) + '</span></div>' +
    renderProjectViewTabs(active) +
    body;
}

function dashboardRoot() { return document.getElementById('dashboard'); }

function showList() {
  dashboardState.projectResult = null;
  dashboardState.ciResult = null;
  dashboardState.telemetryResult = null;
  dashboardState.continuityResult = null;
  dashboardState.handoffResult = null;
  dashboardState.threadCreateResult = null;
  dashboardState.providerReturnText = '';
  dashboardState.methodReturnPreview = null;
  dashboardState.methodReturnSave = null;
  dashboardState.continuityAdvanceResult = null;
  dashboardState.handoffForm = { threadId: '', threadTitle: '', provider: '', route: 'DUMP', draft: '' };
  dashboardState.projectView = 'WORKSPACE';
  dashboardRoot().innerHTML = renderProjectList(dashboardState.list, dashboardState.entry);
}

function showProject() {
  dashboardRoot().innerHTML = renderProjectDetail(
    dashboardState.projectResult,
    dashboardState.ciResult,
    dashboardState.projectView,
    dashboardState.telemetryResult
  );
}

function setProjectHandoffStatus(message, isError) {
  const el = typeof document !== 'undefined' ? document.getElementById('project-handoff-status') : null;
  if (!el) return;
  el.textContent = message;
  el.className = isError ? 'error' : 'muted';
}

function loadProjectContinuity(projectId) {
  google.script.run
    .withSuccessHandler(function (result) {
      dashboardState.continuityResult = result;
      if (result && result.ok === true && Array.isArray(result.threads) && result.threads.length === 1) {
        dashboardState.handoffForm.threadId = result.threads[0].thread_id;
      }
      showProject();
    })
    .withFailureHandler(function () {
      dashboardState.continuityResult = {
        ok: false,
        error: { code: 'SERVER_CALL_FAILED', message: 'Private project threads could not be loaded.' }
      };
      showProject();
    })
    .getDashboardProjectContinuity(projectId);
}

function loadProjectTelemetry(projectId) {
  if (!projectId) return;
  dashboardState.telemetryResult = null;
  showProject();
  google.script.run
    .withSuccessHandler(function (result) {
      dashboardState.telemetryResult = result;
      showProject();
    })
    .withFailureHandler(function () {
      dashboardState.telemetryResult = {
        ok: false,
        observed_at: null,
        error: { code: 'SERVER_CALL_FAILED', message: 'Production telemetry could not be loaded.' }
      };
      showProject();
    })
    .getProductionTelemetry(projectId);
}

function startProjectThread() {
  const project = dashboardState.projectResult && dashboardState.projectResult.project;
  if (!project) return;
  dashboardState.threadCreateResult = null;
  dashboardState.handoffResult = null;
  setProjectHandoffStatus('Starting a private project conversation…', false);
  google.script.run
    .withSuccessHandler(function (result) {
      dashboardState.threadCreateResult = result;
      if (result && result.ok === true && result.thread_id) {
        dashboardState.handoffForm.threadId = result.thread_id;
        loadProjectContinuity(project.project_id);
        return;
      }
      showProject();
    })
    .withFailureHandler(function () {
      dashboardState.threadCreateResult = {
        ok: false,
        error: { code: 'SERVER_CALL_FAILED', message: 'The project conversation could not be started.' }
      };
      showProject();
    })
    .createDashboardProjectThread({
      project_id: project.project_id,
      title: dashboardState.handoffForm.threadTitle,
      current: dashboardState.handoffForm.draft
    });
}

function prepareProjectHandoff() {
  const project = dashboardState.projectResult && dashboardState.projectResult.project;
  if (!project) return;
  dashboardState.handoffResult = null;
  dashboardState.providerReturnText = '';
  dashboardState.methodReturnPreview = null;
  dashboardState.methodReturnSave = null;
  setProjectHandoffStatus('Preparing the conversation for your selected AI…', false);
  google.script.run
    .withSuccessHandler(function (result) {
      dashboardState.handoffResult = result;
      showProject();
    })
    .withFailureHandler(function () {
      dashboardState.handoffResult = {
        ok: false,
        error: { code: 'SERVER_CALL_FAILED', message: 'The AI conversation could not be prepared.' }
      };
      showProject();
    })
    .prepareDashboardProjectHandoff({
      project_id: project.project_id,
      thread_id: dashboardState.handoffForm.threadId,
      provider: dashboardState.handoffForm.provider,
      route: dashboardState.handoffForm.route,
      draft: dashboardState.handoffForm.draft
    });
}

function copyPreparedProjectHandoff() {
  const result = dashboardState.handoffResult;
  if (!result || result.ok !== true || typeof result.bootstrap !== 'string') return;
  if (!navigator.clipboard || typeof navigator.clipboard.writeText !== 'function') {
    setProjectHandoffStatus('Copy is unavailable in this browser. Use SHOW PREPARED TEXT and copy it manually.', true);
    return;
  }
  navigator.clipboard.writeText(result.bootstrap).then(function () {
    setProjectHandoffStatus('Prepared text copied. Open the selected AI and paste it into the chat.', false);
  }).catch(function () {
    setProjectHandoffStatus('Copy failed. Nothing was saved or changed.', true);
  });
}

function showPreparedProjectHandoffText() {
  const result = dashboardState.handoffResult;
  if (!result || result.ok !== true || typeof result.bootstrap !== 'string') return;
  const wrap = document.getElementById('project-handoff-manual');
  const text = document.getElementById('project-handoff-manual-text');
  if (!wrap || !text) return;
  text.textContent = result.bootstrap;
  wrap.hidden = false;
  setProjectHandoffStatus('Prepared text is shown below. Copy it into the selected AI.', false);
}

function openPreparedProjectHandoff() {
  const result = dashboardState.handoffResult;
  if (!result || result.ok !== true || typeof result.provider_url !== 'string') return;
  window.open(result.provider_url, '_blank', 'noopener');
  setProjectHandoffStatus('AI opened. Paste the copied text into the chat.', false);
}

  const project = dashboardState.projectResult && dashboardState.projectResult.project;

    .previewDashboardMethodReturn({
      project_id: project.project_id,
      return_text: dashboardState.providerReturnText
    });
}

function prepareProjectMethodReturnSave() {
  const project = dashboardState.projectResult && dashboardState.projectResult.project;
  if (!project || !dashboardState.methodReturnPreview || dashboardState.methodReturnPreview.ok !== true) return;
  dashboardState.methodReturnSave = null;
  setProjectHandoffStatus('Preparing SAVE for review…', false);
  google.script.run
    .withSuccessHandler(function (result) {
      dashboardState.methodReturnSave = result;
      showProject();
    })
    .withFailureHandler(function () {
      dashboardState.methodReturnSave = {
        ok: false,
        error: { code: 'SERVER_CALL_FAILED', message: 'SAVE could not be prepared for review.' }
      };
      showProject();
    })
    .prepareDashboardMethodReturnSave({
      project_id: project.project_id,
      return_text: dashboardState.providerReturnText
    });
}

function openProjectMethodReturnSave() {
  const result = dashboardState.methodReturnSave;
  if (!result || result.ok !== true || typeof result.save_link !== 'string') return;
  window.open(result.save_link, '_blank', 'noopener');
  setProjectHandoffStatus('SAVE review opened. Check the preview, then use CONFIRM & SYNC when you are ready.', false);
}

function advanceSavedMethodResult(handoffId) {
  const project = dashboardState.projectResult && dashboardState.projectResult.project;
  if (!project || typeof handoffId !== 'string' || !handoffId) return;
  dashboardState.continuityAdvanceResult = null;
  setProjectHandoffStatus('Checking the verified SAVE and continuing this project…', false);
  google.script.run
    .withSuccessHandler(function (result) {
      dashboardState.continuityAdvanceResult = result;
      if (result && result.ok === true) {
        dashboardState.handoffResult = null;
        dashboardState.providerReturnText = '';
        dashboardState.methodReturnPreview = null;
        dashboardState.methodReturnSave = null;
        loadProjectContinuity(project.project_id);
        return;
      }
      showProject();
    })
    .withFailureHandler(function () {
      dashboardState.continuityAdvanceResult = {
        ok: false,
        error: { code: 'SERVER_CALL_FAILED', message: 'The saved result could not be used to continue this project.' }
      };
      showProject();
    })
    .advanceDashboardSavedMethodResult({
      project_id: project.project_id,
      handoff_id: handoffId
    });
}

function captureProjectHandoffField(target) {
  if (!target || !target.id) return false;
  if (target.id === 'project-thread') dashboardState.handoffForm.threadId = target.value;
  else if (target.id === 'project-thread-title') dashboardState.handoffForm.threadTitle = target.value;
  else if (target.id === 'project-provider') dashboardState.handoffForm.provider = target.value;
  else if (target.id === 'project-route') dashboardState.handoffForm.route = target.value;
  else if (target.id === 'project-draft') dashboardState.handoffForm.draft = target.value;
  else return false;
  dashboardState.handoffResult = null;
  dashboardState.threadCreateResult = null;
  dashboardState.providerReturnText = '';
  dashboardState.methodReturnPreview = null;
  dashboardState.methodReturnSave = null;
  return true;
}

function openProject(projectId) {
  dashboardRoot().innerHTML = 'Loading project…';
  google.script.run
    .withSuccessHandler(function (result) {
      if (!result || result.ok !== true) {
        dashboardState.projectResult = result;
        dashboardRoot().innerHTML = renderProjectDetail(result);
        return;
      }

      dashboardState.projectResult = result;
      dashboardState.ciResult = null;
      dashboardState.telemetryResult = null;
      dashboardState.continuityResult = null;
      dashboardState.handoffResult = null;
      dashboardState.threadCreateResult = null;
      dashboardState.providerReturnText = '';
      dashboardState.methodReturnPreview = null;
      dashboardState.methodReturnSave = null;
      dashboardState.continuityAdvanceResult = null;
      dashboardState.projectView = 'WORKSPACE';
      const initialRoute = DASHBOARD_ENTRIES.indexOf(String(result.project && result.project.ui_entry || '').toUpperCase()) >= 0
        ? String(result.project.ui_entry).toUpperCase()
        : 'DUMP';
      dashboardState.handoffForm = { threadId: '', threadTitle: '', provider: '', route: initialRoute, draft: '' };
      showProject();

      const project = result.project || {};
      loadProjectContinuity(project.project_id);
      const repository = typeof project.github_repo === 'string' ? project.github_repo : '';
      const commitSha = project.index_metadata &&
        typeof project.index_metadata.source_commit === 'string'
        ? project.index_metadata.source_commit
        : '';

      if (!repository || !commitSha) {
        dashboardState.ciResult = {
          ok: true,
          repository: repository || null,
          commit_sha: commitSha || null,
          workflow_name: 'ZASS CI',
          job_name: 'zass-check',
          run_id: null,
          status: 'NOT_FOUND',
          conclusion: null,
          run_url: null,
          fetched_at: null
        };
        showProject();
        return;
      }

      google.script.run
        .withSuccessHandler(function (ciResult) {
          dashboardState.ciResult = ciResult;
          showProject();
        })
        .withFailureHandler(function () {
          dashboardState.ciResult = {
            ok: false,
            repository: repository,
            commit_sha: commitSha,
            workflow_name: 'ZASS CI',
            job_name: 'zass-check',
            run_id: null,
            status: 'READ_ERROR',
            conclusion: null,
            run_url: null,
            fetched_at: null,
            error: { code: 'SERVER_CALL_FAILED', message: 'CI status could not be loaded.' }
          };
          showProject();
        })
        .getDashboardZassCiStatus(repository, commitSha);
    })
    .withFailureHandler(function () {
      dashboardState.projectResult = { ok: false, error: { code: 'SERVER_CALL_FAILED', message: 'Project could not be loaded.' } };
      dashboardRoot().innerHTML = renderProjectDetail(dashboardState.projectResult);
    })
    .getDashboardProject(projectId);
}

function handleDashboardClick(event) {
  const target = event.target.closest('button');
  if (!target) return;
  if (target.dataset.entry) { dashboardState.entry = target.dataset.entry; showList(); return; }
  if (target.dataset.projectId !== undefined) { openProject(target.dataset.projectId); return; }
  if (target.dataset.projectView) {
    dashboardState.projectView = target.dataset.projectView;
    showProject();
    if (dashboardState.projectView === 'REVIEW' && dashboardState.telemetryResult === null) {
      const project = dashboardState.projectResult && dashboardState.projectResult.project;
      if (project && project.project_id) loadProjectTelemetry(project.project_id);
    }
    return;
  }
  if (target.dataset.telemetryAction === 'refresh') {
    const project = dashboardState.projectResult && dashboardState.projectResult.project;
    if (project && project.project_id) loadProjectTelemetry(project.project_id);
    return;
  }
  if (target.dataset.handoffAction === 'start-thread') { startProjectThread(); return; }
  if (target.dataset.handoffAction === 'prepare') { prepareProjectHandoff(); return; }
  if (target.dataset.handoffAction === 'copy') { copyPreparedProjectHandoff(); return; }
  if (target.dataset.handoffAction === 'show') { showPreparedProjectHandoffText(); return; }
  if (target.dataset.handoffAction === 'open') { openPreparedProjectHandoff(); return; }
  if (target.dataset.handoffAction === 'preview-return') { previewProjectMethodReturn(); return; }
  if (target.dataset.handoffAction === 'prepare-save') { prepareProjectMethodReturnSave(); return; }
  if (target.dataset.handoffAction === 'open-save') { openProjectMethodReturnSave(); return; }
  if (target.dataset.handoffAction === 'advance-saved-result') { advanceSavedMethodResult(target.dataset.handoffId || ''); return; }
  if (target.dataset.back) { showList(); }
}

function handleDashboardFieldChange(event) {
  if (event.target && event.target.id === 'project-provider-return') {
    dashboardState.providerReturnText = event.target.value;
    dashboardState.methodReturnPreview = null;
    dashboardState.methodReturnSave = null;
    setProjectHandoffStatus('AI result changed. Check it again before preparing SAVE.', false);
    return;
  }
  if (captureProjectHandoffField(event.target)) {
    const threads = dashboardState.continuityResult && dashboardState.continuityResult.ok === true &&
      Array.isArray(dashboardState.continuityResult.threads)
      ? dashboardState.continuityResult.threads
      : null;
    const noThreads = Array.isArray(threads) && threads.length === 0;
    setProjectHandoffStatus(
      noThreads
        ? 'Conversation details changed. START PROJECT CONVERSATION when the title and current context are ready.'
        : 'Conversation details changed. PREPARE FOR AI again before copying or opening.',
      false
    );
  }
}

function bootDashboard() {
  dashboardRoot().addEventListener('click', handleDashboardClick);
  dashboardRoot().addEventListener('input', handleDashboardFieldChange);
  dashboardRoot().addEventListener('change', handleDashboardFieldChange);
  google.script.run
    .withSuccessHandler(function (result) { dashboardState.list = result; showList(); })
    .withFailureHandler(function () {
      dashboardState.list = { ok: false, error: { code: 'SERVER_CALL_FAILED', message: 'Dashboard could not be loaded.' } };
      showList();
    })
    .getDashboardProjects();
}

if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
  window.addEventListener('DOMContentLoaded', bootDashboard);
}
</script>
