<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CrossAI — Sign-in Ready</title>
  <style>
    body{font-family:Inter,Arial,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#071014;color:#f5f7fb}
    main{max-width:560px;margin:24px;padding:28px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:#0c171c;text-align:center}
    p{color:#b9cbd2;line-height:1.55}
    button,a{display:inline-block;margin-top:12px;padding:11px 16px;border-radius:10px;border:1px solid #1598ff;background:#1598ff;color:#fff;text-decoration:none;font:inherit;cursor:pointer}
  </style>
</head>
<body>
<main>
  <h1>CrossAI is ready</h1>
  <p>Your Google / beta access is active. Return to the CrossAI tab and press GO again. Your draft stays there.</p>
  <button id="close" type="button">RETURN TO CROSSAI TAB</button>
</main>
<script>
(function(){
  try {
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({type:'crossai-auth-ready'}, '*');
    }
  } catch (error) {}
  document.getElementById('close').addEventListener('click', function(){
    try {
      if (window.opener && !window.opener.closed) {
        window.opener.focus();
        window.close();
        return;
      }
    } catch (error) {}
    window.location.href = 'https://dzuddiyn.github.io/AISYNC/asc/';
  });
})();
</script>
</body>
</html>
