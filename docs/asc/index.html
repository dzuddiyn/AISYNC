<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASC Public Front Door</title>
  <style>
    :root {
      font-family: Georgia, 'Times New Roman', serif;
      color: #1f2a2e;
      background: #edf2ed;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #edf2ed, #d7e4e0);
    }

    main {
      width: min(32rem, calc(100% - 2rem));
      padding: 2rem;
      background: #fff;
      border: 1px solid #b7c9c1;
      box-shadow: 0 1rem 3rem rgba(31, 42, 46, 0.12);
    }

    h1 { margin-top: 0; }

    #status {
      padding: 0.9rem;
      border-left: 4px solid #34745f;
      background: #edf6f1;
    }

    #status.warning {
      border-color: #a45b2b;
      background: #fff2e8;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }

    button {
      border: 0;
      padding: 0.75rem 1rem;
      font: inherit;
      color: #fff;
      background: #1f5c4a;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    label {
      display: block;
      margin-top: 1.25rem;
      font-weight: 700;
    }

    textarea,
    select {
      box-sizing: border-box;
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.75rem;
      border: 1px solid #aebfba;
      font: inherit;
      color: inherit;
      background: #fff;
    }

    textarea {
      min-height: 7rem;
      resize: vertical;
    }

    .route-state,
    .handoff-preview {
      margin-top: 1.25rem;
      padding: 1rem;
      border: 1px solid #b7c9c1;
      background: #f7faf8;
    }

    .route-state p,
    .handoff-preview p {
      margin: 0.4rem 0;
    }

    .handoff-preview pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: inherit;
    }

    .handoff-preview a {
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h1>ASC Public Front Door</h1>
    <p id="status">Checking for a pending ASC request...</p>
    <p>Sign in in a new tab, return here, then continue the pending request.</p>
    <label for="draft">USER DRAFT</label>
    <textarea id="draft" placeholder="Type your natural first message..."></textarea>

    <label for="provider">AI PROVIDER</label>
    <select id="provider">
      <option value="">Select a provider</option>
      <option value="ChatGPT">ChatGPT</option>
      <option value="Gemini">Gemini</option>
      <option value="Copilot">Copilot</option>
    </select>

    <label for="routeOverride">ROUTE OVERRIDE</label>
    <select id="routeOverride">
      <option value="">Use suggested route</option>
      <option value="DUMP">DUMP</option>
      <option value="DECIDE">DECIDE</option>
      <option value="DESIGN">DESIGN</option>
    </select>

    <section class="route-state" aria-live="polite">
      <p>Suggested route: <strong id="suggestedRoute">DUMP</strong></p>
      <p>Active route: <strong id="activeRoute">DUMP</strong></p>
    </section>

    <div class="actions">
      <button id="signIn" type="button">SIGN IN</button>
      <button id="continue" type="button" disabled>CONTINUE</button>
      <button id="prepareHandoff" type="button" disabled>PREPARE HANDOFF</button>
    </div>

    <section id="handoffPreview" class="handoff-preview" hidden aria-live="polite">
      <h2>Handoff preview</h2>
      <p>Provider: <strong id="previewProvider"></strong></p>
      <p>Route: <strong id="previewRoute"></strong></p>
      <p>Method: <strong id="previewMethod"></strong></p>
      <p>Public Method Gateway URL: <a id="previewGateway" href=""></a></p>
      <p>User draft:</p>
      <pre id="previewDraft"></pre>
      <p>Receiver bootstrap:</p>
      <pre id="receiverBootstrap"></pre>
      <p id="handoffStatus"></p>
      <div class="actions">
        <button id="copyHandoff" type="button" disabled>COPY HANDOFF</button>
        <button id="openProvider" type="button" disabled>OPEN PROVIDER</button>
      </div>
    </section>
  </main>
  <script src="./client.js"></script>
</body>
</html>
