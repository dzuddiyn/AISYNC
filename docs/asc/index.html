<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASC Public Front Door</title>
  <style>
    :root {
      font-family: Georgia, 'Times New Roman', serif;
      color: #1f2a2e;
      background: #edf2ed;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #edf2ed, #d7e4e0);
    }

    main {
      width: min(32rem, calc(100% - 2rem));
      padding: 2rem;
      background: #fff;
      border: 1px solid #b7c9c1;
      box-shadow: 0 1rem 3rem rgba(31, 42, 46, 0.12);
    }

    h1 { margin-top: 0; }

    #status {
      padding: 0.9rem;
      border-left: 4px solid #34745f;
      background: #edf6f1;
    }

    #status.warning {
      border-color: #a45b2b;
      background: #fff2e8;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }

    button {
      border: 0;
      padding: 0.75rem 1rem;
      font: inherit;
      color: #fff;
      background: #1f5c4a;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }
  </style>
</head>
<body>
  <main>
    <h1>ASC Public Front Door</h1>
    <p id="status">Checking for a pending ASC request...</p>
    <p>Sign in in a new tab, return here, then continue the pending request.</p>
    <div class="actions">
      <button id="signIn" type="button">SIGN IN</button>
      <button id="continue" type="button" disabled>CONTINUE</button>
    </div>
  </main>
  <script src="./client.js"></script>
</body>
</html>
