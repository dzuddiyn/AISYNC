<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrossAI</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5f7fb;background:#071014}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 18%,#15343f 0,#0a171d 28%,#050b0e 68%);color:#f5f7fb}
    .shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
    aside{border-right:1px solid rgba(255,255,255,.08);padding:24px 18px;background:rgba(3,8,11,.72)}
    .brand{font-weight:800;letter-spacing:.02em;font-size:1.15rem;margin-bottom:28px}
    .nav-label{font-size:.86rem;font-weight:700;margin:22px 0 8px;color:#dce8ec}
    .nav-line{height:42px;border-left:1px solid rgba(255,255,255,.38);margin-left:8px}
    main{display:flex;align-items:center;justify-content:center;padding:32px}
    .hero{width:min(760px,100%);text-align:center}
    h1{font-size:clamp(2.2rem,5vw,4rem);margin:0 0 8px;letter-spacing:.02em}
    .tagline{color:#c2d0d6;margin:0 auto 28px;max-width:520px;line-height:1.5}
    textarea{width:100%;min-height:180px;resize:vertical;border-radius:18px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.34);color:#fff;padding:20px;font:inherit;font-size:1.05rem;outline:none}
    textarea:focus{border-color:#38a7ff;box-shadow:0 0 0 3px rgba(56,167,255,.13)}
    .providers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
    .provider{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.06);color:#f5f7fb;border-radius:10px;padding:12px 10px;font:inherit;font-weight:700;cursor:pointer}
    .provider[aria-pressed="true"]{border-color:#38a7ff;background:rgba(56,167,255,.18)}
    .go{width:86px;height:86px;border-radius:50%;border:0;background:#1598ff;color:#fff;font-size:2.6rem;font-weight:800;cursor:pointer;box-shadow:0 10px 28px rgba(21,152,255,.28)}
    .go:hover{transform:translateY(-1px)}
    .status{min-height:28px;margin:14px auto 0;max-width:620px;color:#c7d6dc;line-height:1.45}
    .status.error{color:#ff6b6b}
    .status.ok{color:#87e7b3}
    .hint{margin-top:22px;color:#80949c;font-size:.9rem}
    .save-recovery{margin:0 auto 24px;max-width:760px;text-align:left;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.25);border-radius:14px;padding:16px}
    .save-recovery[hidden]{display:none}
    .save-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .save-actions button{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;padding:10px 14px;border-radius:9px;cursor:pointer}
    @media(max-width:760px){.shell{grid-template-columns:1fr}aside{display:none}main{padding:20px}.providers{grid-template-columns:1fr}.go{width:74px;height:74px}}
  </style>
</head>
<body>
<div class="shell">
  <aside aria-label="CrossAI sections">
    <div class="brand">CrossAI</div>
    <div class="nav-label">Dump</div><div class="nav-line"></div>
    <div class="nav-label">Decide</div><div class="nav-line"></div>
    <div class="nav-label">Design</div><div class="nav-line"></div>
  </aside>
  <main>
    <div class="hero">
      <section id="saveRecovery" class="save-recovery" hidden>
        <strong>Continue saved CrossAI request</strong>
        <p id="saveStatus" class="status"></p>
        <div class="save-actions">
          <button id="saveSignIn" type="button">SIGN IN</button>
          <button id="saveContinue" type="button">CONTINUE SAVE</button>
        </div>
      </section>

      <h1>CrossAI</h1>
      <p class="tagline">Dump a thought, compare choices, or build something. Pick an AI and CrossAI handles the rest.</p>

      <textarea id="draft" maxlength="4000" placeholder="Type naturally…"></textarea>

      <div class="providers" role="group" aria-label="Choose AI provider">
        <button class="provider" type="button" data-provider="ChatGPT" aria-pressed="false">ChatGPT</button>
        <button class="provider" type="button" data-provider="Gemini" aria-pressed="false">Gemini</button>
        <button class="provider" type="button" data-provider="Copilot" aria-pressed="false">Copilot</button>
      </div>

      <button id="go" class="go" type="button" aria-label="Go">›</button>
      <p id="startStatus" class="status" aria-live="polite"></p>
      <p class="hint">No project setup first. No method names to learn. CrossAI routes the conversation after sign-in.</p>
    </div>
  </main>
</div>
<script src="./client.js"></script>
</body>
</html>
